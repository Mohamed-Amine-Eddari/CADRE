title: Domain Account Discovery (net user /domain)
id: dd2b95bd-b8d9-4747-9ee9-d52c397fb0bf
status: experimental
description: |
  Tente un net user /domain pour simuler une découverte de comptes AD (échec attendu hors domaine).
references:
  - https://attack.mitre.org/techniques/T1087/002/
author: CADRE PFA
date: 2026/09/08
tags:
