title: File and Directory Discovery (Get-ChildItem récursif)
id: c4d17fd9-9c42-4236-9fd4-6565608f9b08
status: experimental
description: |
  Parcourt récursivement l'arborescence utilisateur à la recherche d'un fichier inexistant — reconnaissance de fichiers/répertoires.
references:
  - https://attack.mitre.org/techniques/T1083/
author: CADRE PFA
date: 2026/09/08
tags:
  - attack.discovery
  - attack.t1083
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    EventID: 1
    CommandLine|contains: 'Get-ChildItem -Path C:\Users -Recurse'
  condition: selection
falsepositives:
  - Indexation de fichiers
  - Antivirus scan
  - Scripts de sauvegarde
level: low
