title: Bash History Access (Credentials In Files)
id: 2bee2c37-2b60-47ae-90df-7f784654bc27
status: experimental
description: |
  Lit l'historique bash à la recherche de secrets.
references:
  - https://attack.mitre.org/techniques/T1552/003/
author: CADRE PFA
date: 2026/09/08
tags:
  - attack.credential_access
  - attack.t1552_003
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    process.title|contains: '.bash_history'
  condition: selection
falsepositives:
  - Diagnostic utilisateur
  - Scripts d'audit
level: medium
