title: Password Policy Discovery (net accounts)
id: b31c97db-33ae-41d8-81d5-f83048c1ed5b
status: experimental
description: |
  Récupère la politique de mots de passe locale via net accounts (préparation brute-force).
references:
  - https://attack.mitre.org/techniques/T1201/
author: CADRE PFA
date: 2026/09/08
tags:
  - attack.discovery
  - attack.t1201
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    EventID: 1
    CommandLine|contains: 'net1 accounts'
  condition: selection
falsepositives:
  - Audit de conformité mot de passe
  - Durcissement légitime
level: low
