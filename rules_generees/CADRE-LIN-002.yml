title: Cron Persistence Test
id: b007ea50-6d22-4cb3-9c09-c32c3885cbf5
status: experimental
description: |
  Ajoute une tâche cron (puis la retire) pour tester la détection de persistance cron.
references:
  - https://attack.mitre.org/techniques/T1053/003/
author: CADRE PFA
date: 2026/09/08
tags:
  - attack.persistence
  - attack.t1053_003
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    process.title|contains: 'crontab -r'
  condition: selection
falsepositives:
  - Tâches cron admin
  - Ansible deploy
level: medium
