title: Software Discovery (registre Uninstall)
id: 25046fd2-fd33-4e60-84e6-77b15477e87a
status: experimental
description: |
  Énumère les logiciels installés via les clés de registre Uninstall — cartographie des applications présentes.
references:
  - https://attack.mitre.org/techniques/T1518/
author: CADRE PFA
date: 2026/09/08
tags:
  - attack.discovery
  - attack.t1518
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    EventID: 1
    CommandLine|contains: 'CurrentVersion\Uninstall'
  condition: selection
falsepositives:
  - Inventaire logiciel (SCCM)
  - Outils de gestion de parc
level: low
