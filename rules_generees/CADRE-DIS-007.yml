title: Local Permission Groups Discovery (net localgroup)
id: e1b5b4dd-00f2-493d-b27f-4f9209afc31e
status: experimental
description: |
  Énumère les membres du groupe administrateurs local via net localgroup.
references:
  - https://attack.mitre.org/techniques/T1069/001/
author: CADRE PFA
date: 2026/09/08
tags:
  - attack.discovery
  - attack.t1069_001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    EventID: 1
    CommandLine|contains: 'localgroup administrators'
  condition: selection
falsepositives:
  - Audit des droits légitime
  - Scripts d'onboarding
level: low
