title: System Service Discovery (tasklist)
id: c8a21144-ef8d-4fa4-be4c-553f117178a8
status: experimental
description: |
  Liste les services et leurs processus via tasklist /svc (cartographie des services).
references:
  - https://attack.mitre.org/techniques/T1007/
author: CADRE PFA
date: 2026/09/08
tags:
  - attack.discovery
  - attack.t1007
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    EventID: 1
    CommandLine|contains: 'tasklist.exe" /svc'
  condition: selection
falsepositives:
  - Inventaire système légitime
  - Scripts d'administration
level: low
