title: SUID/SGID Discovery (chasse aux binaires élevables)
id: d663e128-4f93-4f01-a05a-5bd9f4afc29d
status: experimental
description: |
  Recherche les binaires SUID en lecture seule — reconnaissance de privilège escalade classique (candidats GTFOBins).
references:
