title: System Information Discovery
id: 1029f7d7-fcb9-467a-8257-7ed37a6be35e
status: experimental
description: |
  Collecte des informations système détaillées. Référence T1082 — test classique de découverte.
references:
  - https://attack.mitre.org/techniques/T1082/
author: CADRE PFA
date: 2026/09/08
tags:
  - attack.discovery
  - attack.t1082
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    EventID: 1
    CommandLine|contains: 'systeminfo.exe'
  condition: selection
falsepositives:
  - Inventory tools
  - MDM agents
level: low
