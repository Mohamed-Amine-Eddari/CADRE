title: Non-Standard Port Connection (port 4444)
id: fa5003d5-5249-4231-aebf-3301abff3d14
status: experimental
description: |
  Teste la connectivité TCP vers le port 4444 (port C2 courant, non standard) sur la boucle locale — détection de canal atypique.
references:
  - https://attack.mitre.org/techniques/T1571/
author: CADRE PFA
date: 2026/09/08
tags:
  - attack.command_and_control
  - attack.t1571
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    EventID: 1
    CommandLine|contains: '-Port 4444'
  condition: selection
falsepositives:
  - Tests de connectivité applicatifs
  - Monitoring réseau
level: low
