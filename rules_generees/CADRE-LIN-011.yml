title: Local Account Discovery (/etc/passwd)
id: 8736b080-f215-4ae2-bca9-cd9fcacae15f
status: experimental
description: |
  Énumère les comptes locaux via /etc/passwd.
references:
  - https://attack.mitre.org/techniques/T1087/001/
author: CADRE PFA
date: 2026/09/08
tags:
  - attack.discovery
  - attack.t1087_001
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    process.title|contains: 'cat /etc/passwd'
  condition: selection
falsepositives:
  - Audit des comptes légitime
  - Scripts d'onboarding
level: low
