title: File and Directory Discovery (find)
id: a38a132b-56c4-496e-b276-2da7353135f9
status: experimental
description: |
  Parcourt l'arborescence à la recherche de fichiers de configuration.
references:
  - https://attack.mitre.org/techniques/T1083/
author: CADRE PFA
date: 2026/09/08
tags:
