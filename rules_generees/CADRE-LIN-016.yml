title: Linux File Permissions Modification (chmod)
id: f0cec9f2-133a-40a1-a616-9e381007e227
status: experimental
description: |
  Modifie les permissions d'un fichier temporaire (puis le supprime).
references:
  - https://attack.mitre.org/techniques/T1222/002/
author: CADRE PFA
date: 2026/09/08
tags:
  - attack.defense_evasion
  - attack.t1222_002
logsource:
  product: linux
  category: process_creation
detection:
