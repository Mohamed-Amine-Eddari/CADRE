name: CADRE CI

# Ce workflow se declenche sur chaque push/PR vers main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualite:
    name: Tests, lint, typage, securite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # Hooks pre-commit-hooks qui n'avaient pas d'equivalent CI (donc
      # contournables via --no-verify) : gros fichier accidentel, marqueur
      # de conflit de fusion oublie, cle privee committee par erreur. Places
      # avant les etapes plus lourdes (echec rapide, peu couteux).
      - name: Hygiene du depot (pre-commit-hooks)
        run: |
          pip install pre-commit
          pre-commit run trailing-whitespace --all-files
          pre-commit run end-of-file-fixer --all-files
          pre-commit run check-yaml --all-files
          pre-commit run check-json --all-files
          pre-commit run check-toml --all-files
          pre-commit run check-merge-conflict --all-files
          pre-commit run check-added-large-files --all-files
          pre-commit run detect-private-key --all-files

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Tests + couverture (pytest)
        run: pytest tests/ -q --cov=cadre --cov-report=term-missing --cov-report=xml --cov-fail-under=75

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Formatage (black)
        run: black --check src tests

      - name: Typage (mypy)
        run: mypy src/cadre

      - name: Securite statique (bandit)
        env:
          PYTHONUTF8: "1"
        run: bandit -r src -q

      - name: Audit des dependances (pip-audit)
        run: pip-audit
        continue-on-error: true # une CVE transitive ne doit pas bloquer la CI (voir W6, docs/SECURITY.md)

      - name: Secrets (detect-secrets)
        run: |
          pip install detect-secrets
          detect-secrets scan > /tmp/secrets-scan.json
          python -c "import json,sys; d=json.load(open('/tmp/secrets-scan.json')); sys.exit(1 if d.get('results') else 0)"

      - name: Upload couverture (codecov)
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
