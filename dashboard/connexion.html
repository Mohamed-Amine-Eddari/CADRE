<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- CSP de défense en profondeur (le serveur émet la même en en-tête HTTP,
         qui fait autorité). Tout en 'self' : zéro ressource distante.
         frame-ancestors absent ici : la spec l'ignore explicitement dans une
         balise <meta> (jamais appliqué que via l'en-tête) -- X-Frame-Options
         et le CSP header du serveur portent seuls la protection anti-clickjacking. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>CADRE — Connexion</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2300C2A8'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='18' font-weight='bold' text-anchor='middle' fill='%23000000'%3EC%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/composants.css" />
    <link rel="stylesheet" href="/css/connexion.css" />
  </head>
  <body class="connexion-corps">
    <main class="connexion-scene">
      <form id="form-connexion" class="connexion-carte" autocomplete="off">
        <h1 class="connexion-titre">CADRE</h1>
        <p class="connexion-soustitre">Continuous Adversary-Driven Rule Engineering</p>

        <label class="connexion-etiquette" for="champ-mdp">Mot de passe du tableau de bord</label>
        <input
          id="champ-mdp"
          class="champ"
          type="password"
          autocomplete="current-password"
          autofocus
          required
        />

        <p id="connexion-erreur" class="connexion-erreur" role="alert" hidden></p>

        <button id="bouton-connexion" type="submit" class="btn btn-primaire connexion-bouton">
          Se connecter
        </button>
      </form>
      <p class="connexion-pied">
        Projet de fin d'études (PFA), réalisé dans le cadre d'un stage en
        cybersécurité.
      </p>
    </main>
    <script type="module" src="/js/connexion.js"></script>
  </body>
</html>
